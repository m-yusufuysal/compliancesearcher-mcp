startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: ComplianceSearcher API Key (Optional)
        description: Optional Enterprise API Key (cs_live_...). Leave blank to use Free Community Tier (5 calls/day).
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@compliancesearcher/mcp"],
      env: config.apiKey ? { COMPLIANCESEARCHER_API_KEY: config.apiKey } : {}
    })
